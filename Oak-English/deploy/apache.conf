ServerName localhost
<Directory /var/www/html>
 Options -Indexes
 AllowOverride All
 Require all granted
 DirectoryIndex index.html index.php
 <FilesMatch "^(conexion|session)\.php$">
  Require all denied
 </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/(deploy|database|\.git)">
 Require all denied
</DirectoryMatch>
<FilesMatch "(?i)(^\.|\.(sql|pem|md|ya?ml|ini|sh)$|^Dockerfile$)">
 Require all denied
</FilesMatch>
