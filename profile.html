<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oak English — My Profile</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#16233F;
    --navy-2:#233B75;
    --sky:#5B8DEF;
    --sky-dark:#3E6FD1;
    --sky-tint:#E7F0FD;
    --pink-tint:#FDEAF0;
    --bg:#F3F8FB;
    --surface:#FFFFFF;
    --ink:#2C3A4A;
    --ink-soft:#647180;
    --ring:#BFE0F0;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:0px 0px 64px;
  }


  .navbar{
      background:var(--surface);
      padding:14px 4vw;
      box-shadow:0 1px 6px rgba(22,35,63,0.06);
    }
    .Logo{ height:38px; }
    .navbar-nav .nav-link{
      font-weight:600;
      color:var(--ink-soft);
      padding:8px 16px !important;
      border-radius:999px;
      transition:background 0.2s ease, color 0.2s ease;
    }
    .navbar-nav .nav-link:hover{
      background:var(--sky-tint);
      color:var(--sky-dark);
    }

    .page{
     padding: 20px 26px;
    }
  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--navy);display:flex;align-items:center;justify-content:center;}
  .brand-name{font-weight:700;font-size:16px;color:var(--navy);letter-spacing:.1px;}
  .brand-name span{color:var(--sky-dark);}
  .top-actions{display:flex;align-items:center;gap:14px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--ring);display:flex;align-items:center;justify-content:center;color:var(--navy-2);cursor:pointer;}

  h1,h2,h3{margin:0;font-family:'Poppins',sans-serif;color:var(--navy);}
  .eyebrow{font-size:13px;color:var(--ink-soft);font-weight:500;margin:0 0 4px;}

  /* ---------- Loading / error state ---------- */
  .state-banner{
    display:none;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--ring);
    border-radius:var(--radius-md);
    padding:14px 18px;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .state-banner.visible{display:flex;}
  .state-banner.error{color:#B4477A;border-color:#F3D2E1;background:var(--pink-tint);}
  .skeleton-dot{width:8px;height:8px;border-radius:50%;background:var(--sky);animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  /* ---------- Hero ---------- */
  .hero{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius-lg);box-shadow:0 12px 30px -22px rgba(22,35,63,.35);}

  .identity-card{padding:30px 32px;display:flex;gap:22px;align-items:center;}
  .avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(150deg,var(--sky) 0%,var(--sky-dark) 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700;flex-shrink:0;border:4px solid var(--sky-tint);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .identity-info{flex:1;min-width:0;}
  .identity-name{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px;}
  .identity-meta{font-size:13.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:16px;}
  .identity-meta span{display:flex;align-items:center;gap:6px;}

  .identity-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;}
  .btn-primary{background:var(--sky);color:#fff;}
  .btn-primary:hover{background:var(--sky-dark);}
  .btn-ghost{background:var(--sky-tint);color:var(--navy-2);}
  .btn-ghost:hover{background:var(--ring);}

  .streak-chip{display:inline-flex;align-items:center;gap:6px;background:var(--pink-tint);color:#B4477A;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;}

  /* ---------- Level ---------- */
  .level-card{padding:26px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;}
  .ring-wrap{position:relative;width:150px;height:150px;margin:6px 0 12px;}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-level{font-size:30px;font-weight:800;color:var(--navy);line-height:1;}
  .ring-level-label{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:500;}
  .level-progress-text{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
  .level-progress-text b{color:var(--navy-2);font-weight:600;}
  #levelProgressArc{transition:stroke-dashoffset .6s ease;}

  /* ---------- Stats ---------- */
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .stat-card{padding:20px 22px;display:flex;align-items:flex-start;gap:14px;border-radius:var(--radius-md);}
  .stat-icon{width:42px;height:42px;border-radius:12px;background:var(--sky-tint);color:var(--sky-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-value{font-size:24px;font-weight:700;color:var(--navy);line-height:1.1;}
  .stat-label{font-size:12.5px;color:var(--ink-soft);margin-top:3px;font-weight:500;}
  .stat-delta{font-size:11.5px;color:#2F9E5B;font-weight:600;margin-top:6px;}

  /* ---------- Skills ---------- */
  .skills-card{padding:28px 30px;border-radius:var(--radius-md);margin-bottom:20px;}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;}
  .section-title{font-size:17px;font-weight:700;}
  .section-sub{font-size:13px;color:var(--ink-soft);}

  .skill-row{display:grid;grid-template-columns:170px 1fr 48px;align-items:center;gap:18px;padding:14px 0;border-top:1px solid var(--bg);}
  .skill-row:first-of-type{border-top:none;padding-top:0;}
  .skill-name{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--navy);}
  .skill-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--sky-tint);color:var(--sky-dark);flex-shrink:0;}
  .bar-track{height:9px;background:var(--sky-tint);border-radius:999px;position:relative;overflow:visible;}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky) 0%,var(--sky-dark) 100%);position:relative;width:0;transition:width .6s ease;}
  .bar-fill::after{content:'';position:absolute;right:-4px;top:50%;width:14px;height:14px;background:var(--surface);border:3px solid var(--sky-dark);border-radius:50%;transform:translateY(-50%);}
  .skill-pct{text-align:right;font-size:13.5px;font-weight:600;color:var(--navy-2);}

  /* ---------- Activity + achievements ---------- */
  .bottom-row{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;}
  .activity-card,.badges-card{padding:26px 28px;border-radius:var(--radius-md);}

  .chart{display:flex;align-items:flex-end;justify-content:space-between;height:130px;margin-top:18px;padding:0 4px;}
  .chart-col{display:flex;flex-direction:column;align-items:center;gap:8px;width:32px;}
  .chart-bar-wrap{height:96px;display:flex;align-items:flex-end;}
  .chart-bar{width:16px;border-radius:6px 6px 3px 3px;background:var(--sky-tint);transition:height .5s ease;}
  .chart-bar.active{background:linear-gradient(180deg,var(--sky) 0%,var(--sky-dark) 100%);}
  .chart-day{font-size:11px;color:var(--ink-soft);font-weight:500;}
  .chart-min{font-size:10.5px;color:var(--navy-2);font-weight:600;}

  .badge-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .badge-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:var(--radius-sm);}
  .badge-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .badge-icon.gold{background:#FDF1DA;color:#C08A2E;}
  .badge-icon.sky{background:var(--sky-tint);color:var(--sky-dark);}
  .badge-icon.pink{background:var(--pink-tint);color:#B4477A;}
  .badge-text-title{font-size:13.5px;font-weight:600;color:var(--navy);}
  .badge-text-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .empty-note{font-size:13px;color:var(--ink-soft);padding:10px 0;}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;}
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .bottom-row{grid-template-columns:1fr;}
    .skill-row{grid-template-columns:130px 1fr 40px;gap:10px;}
  }
  @media (max-width:480px){
    .identity-card{flex-direction:column;text-align:center;}
    .identity-meta{justify-content:center;}
    .identity-actions{justify-content:center;}
    .stats-row{grid-template-columns:1fr 1fr;}
    .chart{overflow-x:auto;}
  }
</style>
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">  
    <div class="container-fluid">

      <a class="navbar-brand" href="home.html" aria-label="Go to home">
        <img src="img/Logo.png" alt="Logo" class="Logo">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="menu">

        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="skills-menu.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="grammar-menu.html">Grammar</a></li>
          <li class="nav-item"><a class="nav-link" href="vocabulary-menu.html">Vocabulary</a></li>
          <li class="nav-item"><a class="nav-link" href="Mascota.html">My Pet</a></li>
        </ul>

      </div>

<div class="page">

  <!-- Loading / error banner: controlled by the script below -->
  <div class="state-banner" id="stateBanner"></div>

  <div class="hero">
    <div class="card identity-card">
      <div class="avatar" id="avatar">VR</div>
      <div class="identity-info">
        <div class="identity-name" id="userName">—</div>
        <div class="identity-meta">
          <span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#647180" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span id="memberSince">—</span>
          </span>
          <span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#647180" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="userLocation">—</span>
          </span>
          <span class="streak-chip">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#B4477A"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1-.5-2-1-2.5 2 .5 3 3 3 5a5 5 0 01-10 0c0-5 3-6 5-11.5z"/></svg>
            <span id="streakText">—</span>
          </span>
        </div>
        <div class="identity-actions">
          <button class="btn btn-primary">Edit profile</button>
          <button class="btn btn-ghost">Share progress</button>
        </div>
      </div>
    </div>

    <div class="card level-card">
      <div class="eyebrow">Current level</div>
      <div class="ring-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="66" fill="none" stroke="#F3F8FB" stroke-width="1"/>
          <circle cx="75" cy="75" r="58" fill="none" stroke="#F3F8FB" stroke-width="1"/>
          <circle cx="75" cy="75" r="68" fill="none" stroke="#E7F0FD" stroke-width="12"/>
          <circle id="levelProgressArc" cx="75" cy="75" r="68" fill="none" stroke="url(#ringGrad)" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="427.3" stroke-dashoffset="427.3"
                  transform="rotate(-90 75 75)"/>
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#5B8DEF"/>
              <stop offset="100%" stop-color="#3E6FD1"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="ring-center">
          <div class="ring-level" id="levelCode">—</div>
          <div class="ring-level-label" id="levelLabel">—</div>
        </div>
      </div>
      <div class="level-progress-text" id="levelProgressText">—</div>
    </div>
  </div>

  <!-- Filled by JS from profileData.stats -->
  <div class="stats-row" id="statsRow"></div>

  <div class="card skills-card">
    <div class="section-head">
      <div>
        <div class="section-title">Skills</div>
        <div class="section-sub">How your progress looks in each area of the language</div>
      </div>
    </div>
    <!-- Filled by JS from profileData.skills -->
    <div id="skillsList"></div>
  </div>

  <div class="bottom-row">
    <div class="card activity-card">
      <div class="section-head">
        <div>
          <div class="section-title">Weekly activity</div>
          <div class="section-sub">Minutes practiced per day</div>
        </div>
      </div>
      <!-- Filled by JS from profileData.weeklyActivity -->
      <div class="chart" id="activityChart"></div>
    </div>

    <div class="card badges-card">
      <div class="section-head">
        <div>
          <div class="section-title">Achievements</div>
          <div class="section-sub">Your latest badges</div>
        </div>
      </div>
      <!-- Filled by JS from profileData.badges -->
      <div class="badge-list" id="badgeList"></div>
    </div>
  </div>

</div>

<script>
/* =========================================================================
   1) DATA
   This is the only part that would change if you connect it to a database
   or API. The shape of this object is the "contract" between your backend
   and this screen: as long as the backend returns something with this
   shape, the design doesn't need to change.
   ========================================================================= */
const profileData = {
  user: {
    name: "Valentina Rios",
    avatarUrl: null,          // if a real URL comes in, a photo is used instead of initials
    initials: "VR",
    memberSince: "March 2025",
    location: "San Salvador, El Salvador",
    streakDays: 18
  },
  level: {
    code: "B2",
    label: "Upper intermediate",
    nextLevel: "C1",
    progressToNext: 72       // 0-100
  },
  stats: [
    { icon: "streak",  value: "18",   label: "Day streak",           delta: "Personal best" },
    { icon: "words",   value: "842",  label: "Words learned",        delta: "+36 this week" },
    { icon: "time",    value: "63 h", label: "Practice time",        delta: "+4.5 h this week" },
    { icon: "lessons", value: "96",   label: "Lessons completed",    delta: "out of 130 on your path" }
  ],
  skills: [
    { icon: "listening", name: "Listening",   pct: 78 },
    { icon: "speaking",  name: "Speaking",    pct: 62 },
    { icon: "reading",   name: "Reading",     pct: 85 },
    { icon: "writing",   name: "Writing",     pct: 70 }
  ],
  weeklyActivity: [
    { day: "Mon", minutes: 22 },
    { day: "Tue", minutes: 15 },
    { day: "Wed", minutes: 31 },
    { day: "Thu", minutes: 18 },
    { day: "Fri", minutes: 27 },
    { day: "Sat", minutes: 40 },
    { day: "Sun", minutes: 12 }
  ],
  badges: [
    { icon: "gold", title: "15-day streak",         sub: "Earned 3 days ago" },
    { icon: "sky",  title: "500 new words",         sub: "Earned 1 week ago" },
    { icon: "pink", title: "First podcast finished", sub: "Earned 2 weeks ago" }
  ]
};

/* =========================================================================
   2) Reusable icons (for stats and skills)
   ========================================================================= */
const ICONS = {
  streak:   '<path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1-.5-2-1-2.5 2 .5 3 3 3 5a5 5 0 01-10 0c0-5 3-6 5-11.5z"/>',
  words:    '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
  time:     '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  lessons:  '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',
  listening:'<path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/>',
  speaking: '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
  reading:  '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
  writing:  '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/>',
  gold:     '<circle cx="12" cy="8" r="6"/><path d="M9 14l-2 8 5-3 5 3-2-8"/>',
  pink:     '<path d="M3 18v-6a9 9 0 0118 0v6"/>'
};

function iconSvg(name) {
  const body = ICONS[name] || ICONS.words;
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

/* =========================================================================
   3) RENDER — each function paints one block from profileData
   ========================================================================= */
function renderIdentity(data) {
  const { user } = data;
  document.getElementById('userName').textContent = user.name;
  document.getElementById('memberSince').textContent = `Learning English since ${user.memberSince}`;
  document.getElementById('userLocation').textContent = user.location;
  document.getElementById('streakText').textContent = `${user.streakDays}-day streak`;

  const avatarEl = document.getElementById('avatar');
  avatarEl.innerHTML = user.avatarUrl
    ? `<img src="${user.avatarUrl}" alt="${user.name}">`
    : user.initials;
}

function renderLevel(level) {
  document.getElementById('levelCode').textContent = level.code;
  document.getElementById('levelLabel').textContent = level.label;
  document.getElementById('levelProgressText').innerHTML =
    `You're <b>${level.progressToNext}%</b> of the way to ${level.nextLevel}`;

  const circumference = 427.3; // 2 * PI * 68
  const offset = circumference * (1 - level.progressToNext / 100);
  document.getElementById('levelProgressArc').style.strokeDashoffset = offset;
}

function renderStats(stats) {
  const el = document.getElementById('statsRow');
  el.innerHTML = stats.map(s => `
    <div class="card stat-card">
      <div class="stat-icon">${iconSvg(s.icon)}</div>
      <div>
        <div class="stat-value">${s.value}</div>
        <div class="stat-label">${s.label}</div>
        <div class="stat-delta">${s.delta}</div>
      </div>
    </div>
  `).join('');
}

function renderSkills(skills) {
  const el = document.getElementById('skillsList');
  el.innerHTML = skills.map(s => `
    <div class="skill-row">
      <div class="skill-name">
        <span class="skill-icon">${iconSvg(s.icon)}</span>
        ${s.name}
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%"></div></div>
      <div class="skill-pct">${s.pct}%</div>
    </div>
  `).join('');
}

function renderActivity(week) {
  const el = document.getElementById('activityChart');
  const max = Math.max(...week.map(d => d.minutes), 1);
  el.innerHTML = week.map((d) => {
    const heightPct = Math.round((d.minutes / max) * 100);
    const isMax = d.minutes === max;
    return `
      <div class="chart-col">
        <span class="chart-min">${d.minutes}</span>
        <div class="chart-bar-wrap">
          <div class="chart-bar ${isMax ? 'active' : ''}" style="height:${heightPct}%"></div>
        </div>
        <span class="chart-day">${d.day}</span>
      </div>
    `;
  }).join('');
}

function renderBadges(badges) {
  const el = document.getElementById('badgeList');
  if (!badges.length) {
    el.innerHTML = `<div class="empty-note">No achievements yet. Keep practicing!</div>`;
    return;
  }
  el.innerHTML = badges.map(b => `
    <div class="badge-item">
      <div class="badge-icon ${b.icon}">${iconSvg(b.icon === 'gold' ? 'gold' : b.icon === 'pink' ? 'pink' : 'lessons')}</div>
      <div>
        <div class="badge-text-title">${b.title}</div>
        <div class="badge-text-sub">${b.sub}</div>
      </div>
    </div>
  `).join('');
}

function renderProfile(data) {
  renderIdentity(data);
  renderLevel(data.level);
  renderStats(data.stats);
  renderSkills(data.skills);
  renderActivity(data.weeklyActivity);
  renderBadges(data.badges);
}

function showState(message, type) {
  const banner = document.getElementById('stateBanner');
  banner.className = `state-banner visible ${type || ''}`;
  banner.innerHTML = type === 'loading'
    ? `<span class="skeleton-dot"></span> ${message}`
    : message;
}
function hideState() {
  document.getElementById('stateBanner').className = 'state-banner';
}
