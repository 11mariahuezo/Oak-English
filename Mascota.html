<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino English - My Interactive 3D Pet</title>
    
    <!-- Font Awesome y Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tus Hojas de Estilo -->
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/Mascota.Css">
    <link rel="stylesheet" href="css/responsive-fixes.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/teacher-chat.css">
  <link rel="stylesheet" href="css/accesibility.css">
</head>
<body>

  <!-- Script de verificación de perfil -->
  <script>
    if (!localStorage.getItem("userProfile")) {
      window.location.href = "onboarding.html";
    }
  </script>

  <a class="skip-link visually-hidden-focusable" href="#main-content">Skip to main content</a>

  <!-- Navbar unificado -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="home.html" aria-label="Go to home">
        <img src="img/Logo.png" alt="Logo" class="Logo">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="skills-menu.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="grammar-menu.html">Grammar</a></li>
          <li class="nav-item"><a class="nav-link" href="vocabulary-menu.html">Vocabulary</a></li>
          <li class="nav-item"><a class="nav-link" href="Mascota.html">My Pet</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="dashboard container my-5" id="main-content">
        <header>
            <h1>My Interactive Pet</h1>
            <p class="instructions">Complete English missions to help Dino grow!</p>
        </header>

        <main>
            <section class="mascota-section" aria-label="Dinosaur interaction area">
                <div class="mascota-display" id="mascota-display">
                    <div class="dino-contenedor-img" id="dino-contenedor-img">
                        <img src="" alt="Dinosaur at its current stage" class="dino-img" id="dino-img" role="img">
                    </div>
                </div>
                
                <div class="estado-texto" id="estado-texto" aria-live="polite" aria-atomic="true">
                    Stage 1: Loading adventure...
                </div>

                <div class="progreso-container">
                    <div class="progreso-labels">
                        <label id="lbl-progreso">Growth Progress (Level <span id="nivel-num">1</span>/11)</label>
                        <span id="porcentaje-texto" aria-hidden="true">0%</span>
                    </div>
                    
                    <div class="barra-fondo" role="progressbar" aria-labelledby="lbl-progreso" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="barra-accesible">
                        <div class="barra-progreso" id="barra-progreso"></div>
                    </div>
                    
                    <div class="hitos-lecciones" aria-hidden="true">
                        <span>Egg (1-4)</span>
                        <span>Baby (5-8)</span>
                        <span>Young Dino (9-10)</span>
                        <span>Student (11)</span>
                    </div>
                </div>
            </section>

            <section class="acciones-section" aria-label="Controles principales">
                <button class="btn btn-principal" onclick="completarLeccion()" aria-label="Complete an English lesson and enter your score">
                  <span> Finish English Lesson</span>
                </button>
                <button class="btn btn-secundario" id="btn-interactuar" onclick="interactuarMascota()" aria-label="Pet and show Dino love">
                  <span> Pet Dino</span>
                </button>
                <button class="btn btn-reiniciar" onclick="reiniciarProgreso()" aria-label="Restart the game and return to level 1">
                  Restart Adventure
                </button>
            </section>
        </main>
    </div>

    <!-- Scripts necesarios -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/Mascota.js"></script>
    <script src="JS/teacher-chat.js" defer></script>
    <script src="JS/accesibility.js"></script>
</body>
</html>
